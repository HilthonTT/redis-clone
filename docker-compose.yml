services:
  redisclone.cli:
    image: ${DOCKER_REGISTRY-}redisclonecli
    build:
      context: .
      dockerfile: src/RedisClone.CLI/Dockerfile
    ports:
      - "6379:6379"
  webapp.example:
    image: ${DOCKER_REGISTRY-}webappexample
    build:
      context: .
      dockerfile: src/WebApp.Example/Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"